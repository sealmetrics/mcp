name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: setup-core
        working-directory: setup-core
        run: npm ci && npm test
      - name: mcp-server
        working-directory: mcp-server
        run: npm ci && npm test
      - name: Build the Desktop Extension
        working-directory: mcp-server
        run: npm run pack-mcpb
